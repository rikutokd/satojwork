<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="スポーツ写真家 satoj の作品集。水泳、ラグビー、ボート、トライアスロン、ホッケー、スピードスケート、バスケットボールなど。">
    <link rel="canonical" href="https://satojwork.com/portfolio.html">
    <meta name="theme-color" content="#0e0e0e">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="satoj Photography">
    <meta property="og:title" content="ポートフォリオ | satoj Photography">
    <meta property="og:description" content="競技の一瞬を捉えたスポーツ写真のポートフォリオ。">
    <meta property="og:url" content="https://satojwork.com/portfolio.html">
    <meta property="og:image" content="https://satojwork.com/photos/og.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="stylesheet" href="css/style.css">
</head>
<body data-title-key="doc_title_portfolio">

    <header class="site-header">
        <div class="container">
            <a href="index.html" class="logo">satoj <span>Photography</span></a>
            <nav class="nav" aria-label="Main">
                <a href="index.html" data-i18n="nav_home">ホーム</a>
                <a href="portfolio.html" aria-current="page" data-i18n="nav_portfolio">ポートフォリオ</a>
                <a href="#contact" class="nav-contact" data-i18n="nav_contact">お問い合わせ</a>
                <button id="languageToggle" class="lang-toggle" type="button" data-i18n="switch_lang" data-i18n-attr="aria-label:switch_lang_label">EN</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-head">
            <p class="eyebrow">Works</p>
            <h1 class="heading" data-i18n="portfolio_heading">ポートフォリオ</h1>
            <p class="lead" data-i18n="portfolio_subtitle">スポーツの美しさ、強さ、そして感情を捉える</p>
        </section>

        <ul class="filters" id="filters" data-i18n-attr="aria-label:filter_label" aria-label="競技で絞り込む"></ul>

        <ul class="gallery" id="gallery" aria-live="polite"></ul>

        <noscript><p class="lead">写真の表示には JavaScript を有効にしてください。 / Please enable JavaScript to view the photographs.</p></noscript>
    </main>

    <footer class="site-footer" id="contact">
        <div class="container">
            <p class="eyebrow" data-i18n="contact_eyebrow">Contact</p>
            <h2 class="heading" data-i18n="contact_title">お問い合わせ</h2>
            <p class="lead" data-i18n="contact_text">撮影のご依頼・作品の使用に関するご相談は、メールにてお気軽にご連絡ください。</p>
            <p style="margin-top: 28px;"><a class="contact-mail" href="mailto:lilytorose1055@gmail.com">lilytorose1055@gmail.com</a></p>
            <p class="copyright">&copy; satoj Photography. All rights reserved.</p>
        </div>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" data-i18n-attr="aria-label:lb_label" aria-label="写真の拡大表示">
        <div class="lb-top">
            <span class="lb-counter"></span>
            <button class="lb-btn lb-close" type="button" data-i18n-attr="aria-label:lb_close" aria-label="閉じる">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="lb-stage">
            <img alt="">
            <button class="lb-btn lb-prev" type="button" data-i18n-attr="aria-label:lb_prev" aria-label="前の写真">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button class="lb-btn lb-next" type="button" data-i18n-attr="aria-label:lb_next" aria-label="次の写真">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
            </button>
        </div>
        <p class="lb-caption"></p>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/photos.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
